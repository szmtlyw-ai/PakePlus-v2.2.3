<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码登录 - 常微分方程智能可视化教学平台</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', '微软雅黑', sans-serif;
        }
        body{
            background: linear-gradient(135deg, #0F4C81 0%, #145590 100%);
            color:white;
            display:grid;
            place-items:center;
            height:100vh;
            text-align: center;
        }
        .container{
            width: 100%;
            max-width: 580px; /* 加宽容器最大宽度，适配标题长度 */
            padding: 20px;
        }
        .title{
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 1px;
            white-space: nowrap; /* 强制不换行 */
            overflow: hidden; /* 防止溢出（可选） */
            text-overflow: ellipsis; /* 极端情况显示省略号（可选） */
            width: 100%; /* 占满容器宽度 */
        }
        .subtitle{
            font-size: 16px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .login-box{
            background:white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-box h2{
            color:#333;
            margin-bottom: 30px;
            font-size: 22px;
        }
        input{
            width:100%;
            padding:16px;
            margin:10px 0;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:16px;
        }
        input:focus{
            border-color: #165DFF;
            outline: none;
            transition: 0.2s;
        }
        button{
            width:100%;
            padding:16px;
            background:#165DFF;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            margin-top:10px;
            cursor:pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        button:hover{
            background:#0F4C81;
            transform: translateY(-1px);
        }
        .tip{
            color:red;
            margin-top:15px;
            display:none;
            font-size: 14px;
        }
        .copyright{
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">🧮 常微分方程 | 智能可视化教学平台</h1>
        <p class="subtitle">
            原创AI教学工具 · 课堂教学与自主学习专用<br>
            西北师范大学数学与统计学院 · 陈天兰 设计开发
        </p>

        <div class="login-box">
            <h2>平台密码验证</h2>
            <input type="password" id="pwd" placeholder="请输入访问密码">
            <button onclick="check()">登录进入教学平台</button>
            <div class="tip" id="err">密码错误，请重新输入！</div>
        </div>

        <div class="copyright">© 2025 版权所有 · 盗版必究</div>
    </div>

    <script>
        function check(){
            // ========== 你的密码 ==========
            let rightPwd = "778899";
            // =============================
            
            let val = document.getElementById('pwd').value.trim();
            if(val === rightPwd){
                // 会话存储：关闭浏览器自动退出
                sessionStorage.setItem("allow", "ok");
                // 修复跳转：确保一定跳转到首页
                window.location.href = "index.html";
            }else{
                document.getElementById('err').style.display = "block";
            }
        }
    </script>
</body>
</html>
